name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MCP dependencies
        shell: pwsh
        working-directory: mcp-server
        run: npm ci
      - name: Harness smoke
        shell: pwsh
        run: .\.agents\tests\smoke.ps1 -Json
      - name: Portable install smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\.agent-runs | Out-Null
          .\install.ps1 -TargetProject .\.agent-runs\installed-harness-smoke
          .\.agent-runs\installed-harness-smoke\.agents\tests\smoke.ps1 -Json
      - name: MCP server syntax
        shell: pwsh
        run: |
          node --check .\mcp-server\server.mjs
          node --check .\mcp-server\smoke-client.mjs
          node --check .\mcp-server\side-effect-guard.mjs
          node .\mcp-server\side-effect-guard.test.mjs
          node .\mcp-server\resource-profile-input.test.mjs
          node .\runtime\task-runtime.test.mjs
          node .\runtime\workflow-planner.test.mjs
          node .\runtime\workflow-runtime.test.mjs
          node .\runtime\supervisor-brain.test.mjs
          node .\runtime\runtime-retention.test.mjs
          node .\runtime\harness-runner.test.mjs
          node .\mcp-server\supervisor-dashboard-routes.test.mjs
          node .\mcp-server\supervisor-product-view.test.mjs
      - name: Product startup check
        shell: pwsh
        run: |
          .\scripts\init-config.ps1
          .\start.ps1 -SkipDoctor -CheckOnly
      - name: MCP protocol smoke
        shell: pwsh
        run: .\scripts\test-mcp-protocol.ps1
      - name: Skill lite validation
        shell: pwsh
        run: .\scripts\validate-skill-lite.ps1
      - name: Documentation hygiene
        shell: pwsh
        run: .\scripts\scan-doc-hygiene.ps1
      - name: Release baseline
        shell: pwsh
        run: .\scripts\check-release-baseline.ps1
      - name: Skill harness verification
        shell: pwsh
        run: .\skills\codex-claude-worker\scripts\verify-harness.ps1 -ProjectRoot . -MockWorker
